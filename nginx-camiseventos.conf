# Exemplo de configuração Nginx para camiseventos.co.mz
# Copie para /etc/nginx/sites-available/camiseventos e active com um link
# simbólico em /etc/nginx/sites-enabled/ (ver o Manual de Instalação).

server {
    listen 80;
    server_name camiseventos.co.mz www.camiseventos.co.mz;

    client_max_body_size 50m;   # uploads de comprovativos (fotos/PDF)

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
